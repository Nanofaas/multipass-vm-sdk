name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_integration:
        description: >-
          Run the integration suite. Requires a Multipass daemon, so it will
          fail on a hosted runner - use a self-hosted runner or run it locally.
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Lint, format, types, security.
  #
  # Runs the same hooks as local development through pre-commit, so the two
  # cannot drift. The ruff revision is pinned in .pre-commit-config.yaml and in
  # pyproject.toml; bump both together.
  # ---------------------------------------------------------------------------
  pre-commit:
    name: pre-commit (ruff, basedpyright, bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # ruff's target-version is py311 and the package supports 3.11, so
          # linting on the declared floor is the honest choice.
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install pre-commit
        run: python -m pip install --upgrade pip pre-commit

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure --color=always

  # ---------------------------------------------------------------------------
  # Unit tests + coverage gate.
  #
  # pyproject.toml sets `addopts = "-m 'not integration'"`, so the tests that
  # need a real Multipass daemon stay out of this job.
  # ---------------------------------------------------------------------------
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the declared floor (requires-python >=3.11).
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install project
        run: uv sync --frozen

      - name: Run unit tests with coverage
        run: uv run --frozen pytest tests/unit --cov --cov-report=xml --cov-report=term-missing

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Integration tests against a real Multipass daemon.
  #
  # These cannot run on a hosted runner - Multipass needs nested virtualisation
  # and a running daemon - so the job is opt-in behind an explicit dispatch
  # input. Gating it on `workflow_dispatch` alone was not enough: dispatching for
  # any other reason would run it too, and it would always fail with
  # `FileNotFoundError: 'multipass'`. Point `runs-on` at a self-hosted runner
  # that has Multipass, or run it locally with `uv run pytest -m integration`.
  # ---------------------------------------------------------------------------
  integration:
    name: integration (manual, needs Multipass)
    if: github.event_name == 'workflow_dispatch' && inputs.run_integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install project
        run: uv sync --frozen

      - name: Run integration tests
        run: uv run --frozen pytest -m integration -v --tb=short
